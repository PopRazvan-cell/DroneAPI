[project]
name = "agridrone-api"
version = "0.0.1"
description = "Backend API for AgriDrone CV: water and crop-gap detection from drone imagery"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.13",
    "asyncpg>=0.29",
    "celery[redis]>=5.4",
    "fastapi>=0.115",
    "geoalchemy2>=0.15",
    "pydantic>=2.7",
    "pydantic-settings>=2.5",
    "redis>=5.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "typer>=0.12",
    "tzdata>=2024.1",
    "uvicorn[standard]>=0.30",
]

[project.scripts]
agridrone = "agridrone.cli:app"

[dependency-groups]
dev = [
    "httpx>=0.27",
    "hypothesis>=6.100",
    "mypy>=1.11",
    "pre-commit>=3.7",
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
]
geo = [
    "geopandas>=0.14",
    "pyproj>=3.6",
    "rasterio>=1.3",
    "rio-cogeo>=5.3",
    "shapely>=2.0",
    "titiler.core>=0.18",
    "whitebox>=2.3",
]
cv = [
    "numpy>=1.26",
    "opencv-python-headless>=4.10",
    "scikit-image>=0.24",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agridrone"]

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]
extend-exclude = [".venv", "data", "docs", "ml", "openapi"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["agridrone.core", "agridrone.cv", "agridrone.geo", "agridrone.mission"]
warn_unreachable = true
show_error_codes = true
pretty = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: tests that exercise the API or external services",
]
